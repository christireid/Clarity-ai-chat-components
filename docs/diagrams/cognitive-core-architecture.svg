<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc" rx="12"/>
  <text x="400" y="40" font-family="system-ui" font-size="24" text-anchor="middle" font-weight="bold" fill="#334155">
    Cognitive Core Architecture
  </text>

  <!-- User Interface Layer -->
  <rect x="50" y="80" width="700" height="120" fill="#fff" stroke="#94a3b8" rx="8"/>
  <text x="70" y="110" font-family="system-ui" font-size="16" fill="#64748b">User Interface Layer</text>
  
  <rect x="100" y="130" width="180" height="50" fill="#e0f2fe" stroke="#38bdf8" rx="4"/>
  <text x="190" y="160" font-family="system-ui" font-size="14" text-anchor="middle" fill="#0369a1">useAgent (React)</text>
  
  <rect x="310" y="130" width="180" height="50" fill="#e0f2fe" stroke="#38bdf8" rx="4"/>
  <text x="400" y="160" font-family="system-ui" font-size="14" text-anchor="middle" fill="#0369a1">useTokenContext</text>

  <rect x="520" y="130" width="180" height="50" fill="#e0f2fe" stroke="#38bdf8" rx="4"/>
  <text x="610" y="160" font-family="system-ui" font-size="14" text-anchor="middle" fill="#0369a1">Generative UI</text>

  <!-- Orchestration Layer -->
  <rect x="50" y="240" width="700" height="150" fill="#fff" stroke="#94a3b8" rx="8"/>
  <text x="70" y="270" font-family="system-ui" font-size="16" fill="#64748b">Cognitive Orchestration</text>

  <rect x="150" y="300" width="200" height="60" fill="#f0fdf4" stroke="#4ade80" rx="4"/>
  <text x="250" y="335" font-family="system-ui" font-size="14" text-anchor="middle" fill="#15803d">Token Optimization Engine</text>

  <rect x="450" y="300" width="200" height="60" fill="#f0fdf4" stroke="#4ade80" rx="4"/>
  <text x="550" y="335" font-family="system-ui" font-size="14" text-anchor="middle" fill="#15803d">Streaming State Machine</text>

  <!-- Infrastructure Layer -->
  <rect x="50" y="430" width="700" height="120" fill="#fff" stroke="#94a3b8" rx="8"/>
  <text x="70" y="460" font-family="system-ui" font-size="16" fill="#64748b">Infrastructure Layer</text>

  <rect x="100" y="480" width="180" height="50" fill="#fdf4ff" stroke="#c084fc" rx="4"/>
  <text x="190" y="510" font-family="system-ui" font-size="14" text-anchor="middle" fill="#7e22ce">RAG (Voy WASM)</text>

  <rect x="310" y="480" width="180" height="50" fill="#fdf4ff" stroke="#c084fc" rx="4"/>
  <text x="400" y="510" font-family="system-ui" font-size="14" text-anchor="middle" fill="#7e22ce">MCP Client (SSE)</text>

  <rect x="520" y="480" width="180" height="50" fill="#fdf4ff" stroke="#c084fc" rx="4"/>
  <text x="610" y="510" font-family="system-ui" font-size="14" text-anchor="middle" fill="#7e22ce">Workers & Security</text>

  <!-- Arrows -->
  <path d="M190 180 L190 240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 180 L400 240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M250 360 L190 430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 360 L400 430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
