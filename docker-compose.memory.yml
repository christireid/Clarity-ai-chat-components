# Docker Compose for AI Memory Infrastructure
# Production-ready setup for memory persistence layer

version: '3.8'

services:
  # Qdrant - Vector Database for Semantic Search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clarity-chat-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      # Enable API key authentication in production
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    restart: unless-stopped
    networks:
      - clarity-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis - Fast Cache Layer
  redis:
    image: redis:7-alpine
    container_name: clarity-chat-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory ${REDIS_MAX_MEMORY:-1gb} 
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    networks:
      - clarity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL - Persistent Memory Store
  postgres:
    image: postgres:15-alpine
    container_name: clarity-chat-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clarity_memories}
      POSTGRES_USER: ${POSTGRES_USER:-clarity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped
    networks:
      - clarity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clarity}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis Commander - Redis Management UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: clarity-chat-redis-commander
    profiles:
      - debug
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-}
    networks:
      - clarity-network
    depends_on:
      - redis

  # Optional: pgAdmin - PostgreSQL Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: clarity-chat-pgadmin
    profiles:
      - debug
    ports:
      - "${PGADMIN_PORT:-8082}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@clarity.chat}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - clarity-network
    depends_on:
      - postgres

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  clarity-network:
    driver: bridge

# Usage:
# ------
# Start all services:
#   docker-compose -f docker-compose.memory.yml up -d
#
# Start with debug tools:
#   docker-compose -f docker-compose.memory.yml --profile debug up -d
#
# Stop all services:
#   docker-compose -f docker-compose.memory.yml down
#
# View logs:
#   docker-compose -f docker-compose.memory.yml logs -f
#
# Reset all data (WARNING: destroys all volumes):
#   docker-compose -f docker-compose.memory.yml down -v
