name: Tree-shaking Tests

on:
  pull_request:
    paths:
      - 'packages/react/src/**'
      - 'packages/react/package.json'
      - 'packages/react/tsconfig.json'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tree-shaking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @clarity-ai/react build

      - name: Run tree-shaking tests
        run: |
          cd packages/react/scripts/tree-shaking-test
          pnpm install
          pnpm run build:all
          pnpm run analyze

      - name: Check bundle size thresholds
        run: node packages/react/scripts/tree-shaking-test/check-thresholds.js

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-shaking-report
          path: |
            packages/react/scripts/tree-shaking-test/tree-shaking-report.json
            packages/react/scripts/tree-shaking-test/TREE-SHAKING-REPORT.md
            packages/react/scripts/tree-shaking-test/dist/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'packages/react/scripts/tree-shaking-test/TREE-SHAKING-REPORT.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No report found');
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf-8');

            // Create or update comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Tree-shaking Effectiveness Report')
            );

            const commentBody = `## 🌳 ${report}`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Check for size regressions
        if: github.event_name == 'pull_request'
        run: |
          # Compare with main branch
          git fetch origin main
          git checkout origin/main

          cd packages/react/scripts/tree-shaking-test
          pnpm install
          pnpm run build:all
          pnpm run analyze

          # Save baseline
          cp tree-shaking-report.json baseline-report.json

          # Switch back to PR
          git checkout -

          # Build PR version
          pnpm run build:all
          pnpm run analyze

          # Compare reports
          node compare-reports.js baseline-report.json tree-shaking-report.json
