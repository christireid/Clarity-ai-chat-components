name: Changeset Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  check:
    name: Check for Changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Changesets
        id: changeset-check
        run: |
          # Check if PR includes code changes
          changed_files=$(git diff --name-only origin/main...HEAD)

          # Check if any package source files changed
          if echo "$changed_files" | grep -qE '^packages/.*/src/'; then
            echo "Code changes detected in packages"

            # Count actual changesets (exclude README.md and config.json)
            changeset_count=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

            if [ "$changeset_count" -eq 0 ]; then
              echo "::error::No changeset found. Please run 'pnpm changeset' to create one."
              echo "::error::Changesets are required for package source code changes."
              exit 1
            fi

            echo "✅ Found $changeset_count changeset(s)"
          else
            echo "ℹ️ No package source changes detected, skipping changeset check"
          fi

      - name: Validate Changeset
        run: npx changeset status --verbose
