name: Changeset Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**/src/**'
      - '.changeset/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  check:
    name: Check for Changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Changesets
        id: changeset-check
        run: |
          # Check if PR includes code changes
          changed_files=$(git diff --name-only origin/main...HEAD)

          # Check if any package source files changed
          if echo "$changed_files" | grep -qE '^packages/.*/src/'; then
            echo "Code changes detected in packages"

            # Check if changeset exists
            if ! ls .changeset/*.md >/dev/null 2>&1 || [ $(ls .changeset/*.md 2>/dev/null | wc -l) -eq 0 ]; then
              echo "::error::No changeset found. Please run 'npx changeset' to create one."
              exit 1
            fi

            echo "✅ Changeset found"
          else
            echo "No package source changes detected, skipping changeset check"
          fi

      - name: Validate Changeset
        run: npx changeset status --verbose
