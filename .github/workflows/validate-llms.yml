name: Validate AI Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/app/**'
      - 'apps/docs/scripts/**'
      - '.github/workflows/validate-llms.yml'

# Read-only permissions for validation
permissions:
  contents: read

# Cancel in-progress runs for same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  validate-llms:
    name: Validate llms.txt Generation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation (dry-run)
        id: validate
        run: |
          # Run in preview mode to validate without writing files
          pnpm run generate:llms:preview 2>&1 | tee output.txt

          # Extract warning count from output
          WARNING_COUNT=$(grep -c "⚠️" output.txt || echo "0")
          echo "warning_count=${WARNING_COUNT}" >> $GITHUB_OUTPUT

          # Check for critical errors
          if grep -q "❌" output.txt; then
            echo "❌ Critical errors found in llms.txt generation"
            exit 1
          fi

          # Report warnings but don't fail (content quality warnings are expected)
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "⚠️ Found ${WARNING_COUNT} warning(s)"
          fi

          echo "✅ Validation passed"
        working-directory: apps/docs

      - name: Run script tests
        run: pnpm test scripts/__tests__
        working-directory: apps/docs

      - name: Summary
        if: always()
        run: |
          echo "## 🔍 AI Documentation Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Generation | ${{ steps.validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Warnings | ${{ steps.validate.outputs.warning_count }} |" >> $GITHUB_STEP_SUMMARY
