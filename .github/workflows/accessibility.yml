name: Accessibility Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**/src/**'
      - 'apps/storybook/**'
      - 'apps/docs/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**/src/**'
      - 'apps/storybook/**'
      - 'apps/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  a11y-storybook:
    name: Storybook Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            nodejs.org:443
            playwright.azureedge.net:443
            playwright-verizon.azureedge.net:443
            playwright-akamai.azureedge.net:443

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-a11y-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/**/src/**', 'apps/storybook/**') }}
          restore-keys: |
            ${{ runner.os }}-turbo-a11y-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-a11y-

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Run Storybook accessibility tests
        run: |
          npx concurrently@8 -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server@14 apps/storybook/storybook-static --port 6006 --silent" \
            "npx wait-on@7 http://127.0.0.1:6006 && npx @storybook/test-runner@0 --url http://127.0.0.1:6006"

      - name: Upload accessibility report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: a11y-report
          path: test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            nodejs.org:443
            www.gstatic.com:443
            storage.googleapis.com:443

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lighthouse-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**', 'packages/**/src/**') }}
          restore-keys: |
            ${{ runner.os }}-turbo-lighthouse-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-lighthouse-

      - name: Build docs site
        run: pnpm docs:build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@03becbfc543944dd6e7534f7ff768abb8a296826 # v10.1.0
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
