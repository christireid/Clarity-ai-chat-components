name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**/src/**'
      - 'packages/**/package.json'
      - '.changeset/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Restrict permissions - job-level permissions for finer control
permissions:
  contents: read

# Prevent duplicate release runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel releases in progress

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write # For npm provenance
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@clarity-chat'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-release-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/**/src/**') }}
          restore-keys: |
            ${{ runner.os }}-turbo-release-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-release-

      - name: Build Packages
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@c8bada60c408975afd1a20b3db81d6eee6f45f74 # v1.4.9
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Release Status
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "📦 Packages published!"
          echo "Published packages: ${{ steps.changesets.outputs.publishedPackages }}"
