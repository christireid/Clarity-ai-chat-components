name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual publish)'
        required: false
        default: 'false'
        type: boolean

# Minimal global permissions - job-level for finer control
permissions:
  contents: read

# Prevent duplicate publish runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel publishes in progress

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@clarity-chat'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install peer dependencies for build
        working-directory: packages/react
        run: |
          echo "📦 Installing peer dependencies for production build..."
          node scripts/install-peers-ci.js full

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test --passWithNoTests

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # Don't block publish on moderate vulns

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🔍 Dry run mode - checking what would be published..."
          pnpm -r publish --dry-run --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "📦 Publishing packages to npm..."
          pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release notes
        if: ${{ github.event.inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            npm install @clarity-chat/react
            ```

            ## Quick Start

            ```tsx
            import { initializeClarity, ClarityChat } from '@clarity-chat/react'

            initializeClarity({ license: process.env.CLARITY_LICENSE })

            <ClarityChat api="/api/chat" />
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify Published Packages
    needs: publish
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            registry.npmjs.org:443
            nodejs.org:443

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Create test project
        run: |
          mkdir test-install
          cd test-install
          npm init -y

      - name: Verify installation
        working-directory: test-install
        run: |
          npm install @clarity-chat/react@latest
          echo "✅ Package installed successfully"

      - name: Verify imports
        working-directory: test-install
        run: |
          cat > test.mjs << 'EOF'
          import { ClarityChat, initializeClarity, useClarityChat } from '@clarity-chat/react';
          console.log('✅ Main exports work:', typeof ClarityChat, typeof initializeClarity, typeof useClarityChat);
          EOF
          node test.mjs
