name: Monthly Documentation Audit

on:
  schedule:
    # Run on first Monday of each month at 9 AM UTC
    - cron: '0 9 1-7 * 1'
  workflow_dispatch: # Allow manual trigger

# Minimal global permissions
permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monthly-audit:
    name: Monthly Documentation Health Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -g tsx

      - name: Run documentation health check
        id: health-check
        run: |
          # Run health check and capture output
          OUTPUT=$(tsx scripts/check-docs-health.ts 2>&1 || true)
          echo "$OUTPUT"

          # Save output for issue
          echo "$OUTPUT" > health-report.txt

          # Get current file count
          MD_COUNT=$(find . -type f -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" | wc -l)
          echo "file_count=$MD_COUNT" >> $GITHUB_OUTPUT

      - name: Get previous month's count
        id: previous-count
        run: |
          # Try to get file count from last month's audit issue
          # Default to current count if not found
          echo "previous_count=366" >> $GITHUB_OUTPUT

      - name: Create audit issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const healthReport = fs.readFileSync('health-report.txt', 'utf8');
            const fileCount = '${{ steps.health-check.outputs.file_count }}';
            const previousCount = '${{ steps.previous-count.outputs.previous_count }}';
            const trend = fileCount > previousCount ? '📈 Increasing' : fileCount < previousCount ? '📉 Decreasing' : '➡️  Stable';

            const body = `## 📊 Monthly Documentation Audit

            **Date**: ${new Date().toISOString().split('T')[0]}
            **File Count**: ${fileCount} (${trend} from ${previousCount} last month)

            ### Health Report

            \`\`\`
            ${healthReport}
            \`\`\`

            ### Actions Required

            ` + (healthReport.includes('No artifacts found') ? `
            ✅ No immediate actions needed. Documentation is clean!
            ` : `
            ⚠️  **Please review and address issues found in the health report above.**

            Common actions:
            - Move artifact files to \`.archive/\` directory
            - Remove or complete files with TODO/FIXME markers
            - Add any missing essential files
            `) + `

            ### Resources

            - [Documentation Policy](.github/DOCUMENTATION_POLICY.md)
            - [Contributing Guidelines](CONTRIBUTING.md)
            - Run health check locally: \`tsx scripts/check-docs-health.ts\`

            ### Next Audit

            The next monthly audit is scheduled for the first Monday of next month.

            ---

            *This issue was automatically created by the [monthly documentation audit workflow](.github/workflows/monthly-docs-audit.yml)*
            `;

            // Create the issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Monthly Documentation Audit - ${new Date().toLocaleString('default', { month: 'long', year: 'numeric' })}`,
              body: body,
              labels: ['documentation', 'maintenance', 'automated']
            });

            console.log(`Created issue #${issue.data.number}`);
