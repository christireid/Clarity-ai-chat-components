name: Documentation Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Minimal global permissions
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Node.js version consistency
        run: |
          PKG_NODE=$(jq -r '.engines.node' package.json)
          echo "Package.json requires: $PKG_NODE"

          # Check for outdated Node.js 18 references
          if grep -rq "Node\.js 18" docs/ README.md packages/*/README.md 2>/dev/null; then
            echo "❌ Found 'Node.js 18' references but package.json requires $PKG_NODE"
            grep -rn "Node\.js 18" docs/ README.md packages/*/README.md 2>/dev/null || true
            exit 1
          fi
          echo "✅ Node.js version references are consistent"

      - name: Check TypeScript version consistency
        run: |
          TS_VERSION=$(jq -r '.devDependencies.typescript' package.json | sed 's/\^//')
          echo "Package.json TypeScript: $TS_VERSION"

          # Check for outdated TypeScript version in badges
          if grep -q "TypeScript-5\.3" README.md 2>/dev/null; then
            echo "❌ README badge shows TypeScript 5.3 but package.json has $TS_VERSION"
            exit 1
          fi
          echo "✅ TypeScript version references are consistent"

      - name: Verify documented exports exist
        run: |
          chmod +x scripts/verify-docs-exports.sh
          ./scripts/verify-docs-exports.sh

  validate-hook-metadata:
    name: Validate Hook Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate hook metadata
        run: pnpm --filter @clarity-chat/docs validate:hooks

  validate-examples:
    name: Validate Code Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate code examples
        run: pnpm --filter @clarity-chat/docs validate:examples
