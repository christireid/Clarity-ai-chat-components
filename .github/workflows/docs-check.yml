name: Documentation Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'

# Minimal global permissions
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # ============================================
  # TYPECHECK - Docs-specific TypeScript check
  # ============================================
  docs-typecheck:
    name: Docs TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=@clarity-chat/docs^...

      - name: Run docs typecheck
        run: pnpm --filter @clarity-chat/docs typecheck

      - name: TypeScript check summary
        if: always()
        run: |
          echo "## 📊 Docs TypeScript Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All TypeScript checks passed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The docs site has 0 TypeScript errors." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **TypeScript errors found**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please fix the errors above before merging." >> $GITHUB_STEP_SUMMARY
          fi

  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Node.js version consistency
        run: |
          PKG_NODE=$(jq -r '.engines.node' package.json)
          echo "Package.json requires: $PKG_NODE"

          # Check for outdated Node.js 18 references
          if grep -rq "Node\.js 18" docs/ README.md packages/*/README.md 2>/dev/null; then
            echo "❌ Found 'Node.js 18' references but package.json requires $PKG_NODE"
            grep -rn "Node\.js 18" docs/ README.md packages/*/README.md 2>/dev/null || true
            exit 1
          fi
          echo "✅ Node.js version references are consistent"

      - name: Check TypeScript version consistency
        run: |
          TS_VERSION=$(jq -r '.devDependencies.typescript' package.json | sed 's/\^//')
          echo "Package.json TypeScript: $TS_VERSION"

          # Check for outdated TypeScript version in badges
          if grep -q "TypeScript-5\.3" README.md 2>/dev/null; then
            echo "❌ README badge shows TypeScript 5.3 but package.json has $TS_VERSION"
            exit 1
          fi
          echo "✅ TypeScript version references are consistent"

      - name: Verify documented exports exist
        run: |
          chmod +x scripts/verify-docs-exports.sh
          ./scripts/verify-docs-exports.sh

  validate-hook-metadata:
    name: Validate Hook Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate hook metadata
        run: pnpm --filter @clarity-chat/docs validate:hooks

  validate-examples:
    name: Validate Code Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate code examples
        run: pnpm --filter @clarity-chat/docs validate:examples

  check-documentation-counts:
    name: Check Documentation Counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for deprecated component counts
        run: |
          echo "Checking for deprecated '70+ components' pattern..."
          if grep -rE "70\+\s*(components?|Components?)" apps/docs/app/ apps/docs/components/ apps/docs/public/*.txt 2>/dev/null | grep -v "SALES_DECK"; then
            echo "❌ Found deprecated '70+ components' pattern in user-facing docs"
            exit 1
          fi
          echo "✅ No deprecated component counts found"

      - name: Check for deprecated hook counts
        run: |
          echo "Checking for deprecated '35+ hooks' pattern..."
          if grep -rE "35\+\s*(hooks?|Hooks?)" apps/docs/app/ apps/docs/components/ apps/docs/public/*.txt 2>/dev/null | grep -v "SALES_DECK"; then
            echo "❌ Found deprecated '35+ hooks' pattern in user-facing docs"
            exit 1
          fi
          echo "✅ No deprecated hook counts found"

      - name: Check for deprecated theme counts
        run: |
          echo "Checking for deprecated '11 themes' pattern..."
          if grep -rE "11\+?\s*(themes?|pre-?built)" apps/docs/app/ apps/docs/components/ apps/docs/public/*.txt 2>/dev/null | grep -v "SALES_DECK"; then
            echo "❌ Found deprecated '11 themes' pattern in user-facing docs"
            exit 1
          fi
          echo "✅ No deprecated theme counts found"

      - name: Verify current counts are present
        run: |
          echo "Verifying current counts in key files..."

          # Check homepage - accept either literal or LIBRARY_STATS import
          if ! grep -q "190+ components" apps/docs/app/page.tsx && \
             ! grep -q "LIBRARY_STATS" apps/docs/app/page.tsx; then
            echo "❌ Homepage missing '190+ components' or LIBRARY_STATS import"
            exit 1
          fi

          # Check llms.txt (static file, must have literal values)
          if ! grep -q "190+" apps/docs/public/llms.txt 2>/dev/null; then
            echo "❌ llms.txt missing current component count (190+)"
            exit 1
          fi

          # Verify library-stats.ts exists and has correct values
          if ! grep -q "components: '190+'" apps/docs/lib/library-stats.ts 2>/dev/null; then
            echo "❌ library-stats.ts missing or has incorrect component count"
            exit 1
          fi

          echo "✅ Current counts verified in key files"
