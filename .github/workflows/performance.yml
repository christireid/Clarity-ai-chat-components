name: Performance Monitoring

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - '.lighthouserc.json'
      - '.size-limit.json'
  push:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: cd apps/docs && pnpm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install size-limit
        run: pnpm add -D size-limit @size-limit/preset-small-lib @size-limit/file

      - name: Build packages
        run: pnpm run build

      - name: Check bundle size
        run: pnpm size-limit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with bundle size
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install_and_build

  performance-budgets:
    name: Performance Budget Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: cd apps/docs && pnpm run build

      - name: Analyze bundle
        run: |
          cd apps/docs
          echo "📦 Bundle Analysis Report" > bundle-report.txt
          echo "=========================" >> bundle-report.txt
          echo "" >> bundle-report.txt

          # Get build output size
          du -sh .next >> bundle-report.txt
          echo "" >> bundle-report.txt

          # Check for large dependencies
          echo "🔍 Large Dependencies:" >> bundle-report.txt
          find .next/static -name "*.js" -size +100k -exec ls -lh {} \; >> bundle-report.txt || echo "No files > 100KB" >> bundle-report.txt

          cat bundle-report.txt

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: apps/docs/bundle-report.txt

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [lighthouse, bundle-size, performance-budgets]
    if: always()
    steps:
      - name: Check performance results
        run: |
          echo "✅ Performance monitoring completed"
          echo "📊 Lighthouse CI: Check PR comments for results"
          echo "📦 Bundle Size: Check PR comments for results"
          echo "🎯 Performance Budgets: Verified"
