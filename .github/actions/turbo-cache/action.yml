name: 'Setup Turbo Cache'
description: 'Configures Turbo local caching for GitHub Actions'

inputs:
  task:
    description: 'The Turbo task name for cache key segmentation'
    required: true
  extra-hash-files:
    description: 'Additional files to include in cache hash (comma-separated glob patterns)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Cache Turbo
      uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.task }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/**/src/**') }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.task }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
          ${{ runner.os }}-turbo-${{ inputs.task }}-
