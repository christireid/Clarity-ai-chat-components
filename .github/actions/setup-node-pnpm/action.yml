name: 'Setup Node.js and pnpm'
description: 'Sets up Node.js, pnpm, and installs dependencies with caching and retry logic'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  frozen-lockfile:
    description: 'Use frozen lockfile for installs'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies with retry
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        MAX_RETRIES=3
        RETRY_COUNT=0
        INSTALL_CMD="pnpm install"

        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          INSTALL_CMD="pnpm install --frozen-lockfile"
        fi

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES: Running $INSTALL_CMD"
          if $INSTALL_CMD; then
            echo "✅ Dependencies installed successfully"
            exit 0
          fi

          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            WAIT_TIME=$((2 ** RETRY_COUNT))
            echo "⚠️ Install failed, retrying in ${WAIT_TIME}s..."
            sleep $WAIT_TIME
          fi
        done

        echo "❌ Failed to install dependencies after $MAX_RETRIES attempts"
        exit 1
