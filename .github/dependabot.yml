version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "christireid"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "christireid"
    open-pull-requests-limit: 10
    groups:
      development:
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "react"
          - "next"
      production:
        dependency-type: "production"
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "next"
    ignore:
      # Major version updates for core dependencies should be manual
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
