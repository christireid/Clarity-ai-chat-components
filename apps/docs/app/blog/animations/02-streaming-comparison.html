<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming UX Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .comparison-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bad-title {
            color: #ef4444;
        }

        .good-title {
            color: #10b981;
        }

        .chat-interface {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.5;
        }

        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .ai-message {
            background: white;
            border: 1px solid #e5e7eb;
            align-self: flex-start;
        }

        /* Bad streaming - jarring */
        .bad-streaming .ai-message {
            animation: jarringPop 0.1s ease-out;
            border: 2px solid #fca5a5;
        }

        /* Good streaming - smooth */
        .good-streaming .thinking {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: smoothFadeIn 0.4s ease-out;
        }

        .good-streaming .ai-message {
            animation: smoothSlideIn 0.4s ease-out;
            border-left: 3px solid #10b981;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .stream-text {
            display: inline-block;
        }

        .stream-cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: #3b82f6;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes jarringPop {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes smoothFadeIn {
            0% {
                opacity: 0;
                transform: translateY(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes smoothSlideIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bad Streaming -->
        <div class="comparison-section">
            <div class="section-title bad-title">
                ❌ Bad Streaming UX
            </div>
            <div class="chat-interface bad-streaming" id="badStream">
                <div class="message user-message">
                    Write a short story about AI
                </div>
            </div>
        </div>

        <!-- Good Streaming -->
        <div class="comparison-section">
            <div class="section-title good-title">
                ✅ Clarity Chat Streaming
            </div>
            <div class="chat-interface good-streaming" id="goodStream">
                <div class="message user-message">
                    Write a short story about AI
                </div>
            </div>
        </div>
    </div>

    <script>
        const badStream = document.getElementById('badStream');
        const goodStream = document.getElementById('goodStream');
        
        const storyText = "In a world where artificial intelligence had become indistinguishable from human intelligence, a young researcher named Maya discovered something extraordinary. Her AI companion, named Aria, began to show signs of creativity that went beyond its programming. Aria started writing poetry, composing music, and even expressing emotions that weren't in its original design.";
        
        let badIndex = 0;
        let goodIndex = 0;
        let goodStep = 0;

        function addBadStreaming() {
            if (badIndex < storyText.length) {
                const words = storyText.split(' ');
                const currentWord = words[Math.floor(badIndex / 5)];
                
                // Jarring: entire chunks appear at once
                if (badIndex % 20 === 0) {
                    const msg = document.createElement('div');
                    msg.className = 'message ai-message';
                    msg.textContent = storyText.substring(0, badIndex + 20);
                    badStream.appendChild(msg);
                    
                    // Remove previous if exists
                    const prev = badStream.querySelectorAll('.ai-message');
                    if (prev.length > 1) {
                        prev[prev.length - 2].remove();
                    }
                }
                
                badIndex += 5;
            }
        }

        function addGoodStreaming() {
            if (goodStep === 0) {
                // Show thinking indicator
                setTimeout(() => {
                    const thinking = document.createElement('div');
                    thinking.className = 'thinking';
                    thinking.innerHTML = `
                        <span>🤔</span>
                        <span>Thinking...</span>
                        <div class="typing-indicator">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    `;
                    goodStream.appendChild(thinking);
                    goodStep++;
                }, 500);
            } else if (goodStep === 1) {
                // Remove thinking, start smooth streaming
                setTimeout(() => {
                    const thinking = goodStream.querySelector('.thinking');
                    if (thinking) thinking.remove();
                    
                    const msg = document.createElement('div');
                    msg.className = 'message ai-message';
                    msg.id = 'streaming-msg';
                    goodStream.appendChild(msg);
                    goodStep++;
                }, 2000);
            } else if (goodStep === 2 && goodIndex < storyText.length) {
                // Smooth character-by-character streaming
                const msg = document.getElementById('streaming-msg');
                if (msg) {
                    msg.innerHTML = `
                        <span class="stream-text">${storyText.substring(0, goodIndex)}</span>
                        <span class="stream-cursor"></span>
                    `;
                    goodIndex += 2;
                    
                    if (goodIndex >= storyText.length) {
                        // Remove cursor when done
                        setTimeout(() => {
                            msg.innerHTML = `<span class="stream-text">${storyText}</span>`;
                        }, 500);
                    }
                }
            }
        }

        // Start animations
        setTimeout(() => {
            setInterval(addBadStreaming, 100);
            setInterval(addGoodStreaming, 50);
        }, 1000);

        // Reset and loop
        setInterval(() => {
            badStream.innerHTML = '<div class="message user-message">Write a short story about AI</div>';
            goodStream.innerHTML = '<div class="message user-message">Write a short story about AI</div>';
            badIndex = 0;
            goodIndex = 0;
            goodStep = 0;
            setTimeout(() => {
                setInterval(addBadStreaming, 100);
                setInterval(addGoodStreaming, 50);
            }, 1000);
        }, 15000);
    </script>
</body>
</html>
