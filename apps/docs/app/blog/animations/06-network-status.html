<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Status Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            position: relative;
        }

        .network-status {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .network-status.online {
            background: #d1fae5;
            color: #065f46;
        }

        .network-status.offline {
            background: #fee2e2;
            color: #991b1b;
            animation: pulse 2s infinite;
        }

        .network-status.slow {
            background: #fef3c7;
            color: #92400e;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        .network-status.online .status-dot {
            background: #10b981;
        }

        .network-status.offline .status-dot {
            background: #ef4444;
        }

        .network-status.slow .status-dot {
            background: #f59e0b;
        }

        .chat-window {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
        }

        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .ai-message {
            background: white;
            border: 1px solid #e5e7eb;
            align-self: flex-start;
        }

        .queued-message {
            background: #f3f4f6;
            border: 2px dashed #9ca3af;
            color: #6b7280;
            opacity: 0.6;
        }

        .reconnecting-indicator {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 12px;
            font-size: 13px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease-out;
        }

        .reconnect-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #fbbf24;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="network-status online" id="networkStatus">
            <div class="status-dot"></div>
            <span>Online</span>
        </div>
        
        <div class="chat-window" id="chatWindow">
            <div class="message user-message">
                What's the weather forecast?
            </div>
        </div>
    </div>

    <script>
        const networkStatus = document.getElementById('networkStatus');
        const chatWindow = document.getElementById('chatWindow');
        let step = 0;
        let queuedMessages = [];

        function simulateNetworkFlow() {
            if (step === 0) {
                // Start online, send message
                setTimeout(() => {
                    const msg = document.createElement('div');
                    msg.className = 'message ai-message';
                    msg.textContent = 'Checking weather data...';
                    chatWindow.appendChild(msg);
                    step++;
                }, 1000);
            } else if (step === 1) {
                // Network goes offline
                setTimeout(() => {
                    networkStatus.className = 'network-status offline';
                    networkStatus.innerHTML = '<div class="status-dot"></div><span>Offline</span>';
                    
                    const indicator = document.createElement('div');
                    indicator.className = 'reconnecting-indicator';
                    indicator.innerHTML = `
                        <div class="reconnect-spinner"></div>
                        <span>Connection lost. Reconnecting...</span>
                    `;
                    chatWindow.appendChild(indicator);
                    
                    // Queue a message
                    const queued = document.createElement('div');
                    queued.className = 'message user-message queued-message';
                    queued.textContent = 'Get the forecast for tomorrow';
                    chatWindow.appendChild(queued);
                    queuedMessages.push(queued);
                    
                    step++;
                }, 3000);
            } else if (step === 2) {
                // Show slow/unstable
                setTimeout(() => {
                    networkStatus.className = 'network-status slow';
                    networkStatus.innerHTML = '<div class="status-dot"></div><span>Slow Connection</span>';
                    step++;
                }, 4000);
            } else if (step === 3) {
                // Reconnect
                setTimeout(() => {
                    networkStatus.className = 'network-status online';
                    networkStatus.innerHTML = '<div class="status-dot"></div><span>Online</span>';
                    
                    const indicator = chatWindow.querySelector('.reconnecting-indicator');
                    if (indicator) {
                        indicator.innerHTML = '<span>✅ Connected</span>';
                        setTimeout(() => indicator.remove(), 1500);
                    }
                    
                    // Send queued messages
                    queuedMessages.forEach(msg => {
                        msg.classList.remove('queued-message');
                        msg.style.opacity = '1';
                        msg.style.border = 'none';
                    });
                    
                    setTimeout(() => {
                        const response = document.createElement('div');
                        response.className = 'message ai-message';
                        response.textContent = 'Tomorrow: Sunny, 75°F with light winds.';
                        chatWindow.appendChild(response);
                    }, 1000);
                    
                    queuedMessages = [];
                    step = 0;
                }, 6000);
            }
        }

        // Start animation
        setInterval(simulateNetworkFlow, 12000);
        setTimeout(simulateNetworkFlow, 1000);

        // Reset loop
        setInterval(() => {
            chatWindow.innerHTML = '<div class="message user-message">What\'s the weather forecast?</div>';
            networkStatus.className = 'network-status online';
            networkStatus.innerHTML = '<div class="status-dot"></div><span>Online</span>';
            step = 0;
            queuedMessages = [];
            setTimeout(simulateNetworkFlow, 1000);
        }, 20000);
    </script>
</body>
</html>
