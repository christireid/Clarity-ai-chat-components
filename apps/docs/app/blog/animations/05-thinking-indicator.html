<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking Indicator Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .thinking-indicator {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            animation: fadeIn 0.4s ease-out;
        }

        .icon {
            font-size: 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        .content {
            flex: 1;
        }

        .stage-label {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
            animation: shimmer 1.5s infinite;
        }

        .dots {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .stage {
            display: none;
        }

        .stage.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="thinking-indicator" id="indicator">
            <div class="icon" id="icon">🤔</div>
            <div class="content">
                <div class="stage-label" id="label">Thinking...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress" style="width: 0%"></div>
                </div>
                <div class="dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stages = [
            { icon: '🤔', label: 'Thinking...', progress: 20 },
            { icon: '🔍', label: 'Researching...', progress: 40 },
            { icon: '📝', label: 'Compiling...', progress: 60 },
            { icon: '✨', label: 'Generating...', progress: 80 },
            { icon: '✅', label: 'Finalizing...', progress: 95 }
        ];
        
        let currentStage = 0;
        const icon = document.getElementById('icon');
        const label = document.getElementById('label');
        const progress = document.getElementById('progress');
        
        function updateStage() {
            if (currentStage < stages.length) {
                const stage = stages[currentStage];
                icon.textContent = stage.icon;
                label.textContent = stage.label;
                progress.style.width = `${stage.progress}%`;
                
                currentStage++;
            } else {
                // Reset
                currentStage = 0;
                setTimeout(() => {
                    updateStage();
                }, 1000);
            }
        }
        
        // Start animation
        updateStage();
        setInterval(updateStage, 2000);
    </script>
</body>
</html>
