<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation 1: Instant vs Realistic Response</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 800px;
      height: 450px;
      display: flex;
      gap: 2px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .side {
      flex: 1;
      background: #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .side.bad {
      background: linear-gradient(135deg, #1e293b 0%, #2d1f2f 100%);
    }

    .side.good {
      background: linear-gradient(135deg, #1e293b 0%, #1f2d3d 100%);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .bad .header {
      color: #ef4444;
    }

    .good .header {
      color: #10b981;
    }

    .icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .message {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 85%;
      word-wrap: break-word;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
      background: hsl(217, 91%, 60%);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
    }

    .thinking-indicator {
      align-self: flex-start;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s ease-out;
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: bounce 1.5s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: hsl(217, 91%, 60%);
      margin-left: 2px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    .status-badge {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: popIn 0.3s ease-out;
      z-index: 10;
    }

    @keyframes popIn {
      from {
        transform: translateY(-50%) scale(0);
      }
      to {
        transform: translateY(-50%) scale(1);
      }
    }

    .bad .status-badge {
      background: rgba(239, 68, 68, 0.2);
    }

    .good .status-badge {
      background: rgba(16, 185, 129, 0.2);
    }

    .label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .progress-stage {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: hsl(217, 91%, 60%);
      border-radius: 2px;
      transition: width 0.3s ease-out;
    }

    .stage-icon {
      font-size: 16px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- BAD SIDE -->
    <div class="side bad">
      <div class="header">
        <span class="icon">❌</span>
        <span>INSTANT (Bad UX)</span>
      </div>
      <div class="chat-area" id="badChat"></div>
    </div>

    <!-- GOOD SIDE -->
    <div class="side good">
      <div class="header">
        <span class="icon">✅</span>
        <span>REALISTIC (Good UX)</span>
      </div>
      <div class="chat-area" id="goodChat"></div>
    </div>
  </div>

  <script>
    const badChat = document.getElementById('badChat');
    const goodChat = document.getElementById('goodChat');

    function addMessage(container, text, type, delay = 0) {
      return new Promise(resolve => {
        setTimeout(() => {
          const msg = document.createElement('div');
          msg.className = `message ${type}`;
          msg.textContent = text;
          container.appendChild(msg);
          resolve();
        }, delay);
      });
    }

    function addThinkingIndicator(container, text, delay = 0) {
      return new Promise(resolve => {
        setTimeout(() => {
          const indicator = document.createElement('div');
          indicator.className = 'thinking-indicator';
          indicator.innerHTML = `
            <span class="stage-icon">🤔</span>
            <span>${text}</span>
            <div class="dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          `;
          container.appendChild(indicator);
          resolve(indicator);
        }, delay);
      });
    }

    function removeElement(element, delay = 0) {
      return new Promise(resolve => {
        setTimeout(() => {
          element.remove();
          resolve();
        }, delay);
      });
    }

    function typeMessage(container, text, delay = 0) {
      return new Promise(resolve => {
        setTimeout(() => {
          const msg = document.createElement('div');
          msg.className = 'message assistant';
          container.appendChild(msg);

          let index = 0;
          const interval = setInterval(() => {
            if (index < text.length) {
              msg.innerHTML = text.substring(0, index + 1) + '<span class="typing-cursor"></span>';
              index++;
            } else {
              clearInterval(interval);
              msg.innerHTML = text;
              resolve();
            }
          }, 30);
        }, delay);
      });
    }

    async function runBadSequence() {
      badChat.innerHTML = '';
      await addMessage(badChat, "What's the capital of France?", 'user', 0);
      await addMessage(badChat, "The capital of France is Paris, a beautiful city known for its iconic Eiffel Tower, rich history, and cultural significance.", 'assistant', 500);
      
      // Show bad badge
      const badge = document.createElement('div');
      badge.className = 'status-badge';
      badge.textContent = '❌';
      badChat.parentElement.appendChild(badge);
      
      await new Promise(resolve => setTimeout(resolve, 2000));
      badge.remove();
    }

    async function runGoodSequence() {
      goodChat.innerHTML = '';
      await addMessage(goodChat, "What's the capital of France?", 'user', 0);
      
      // Stage 1: Reading
      const reading = await addThinkingIndicator(goodChat, "Reading your message...", 500);
      await new Promise(resolve => setTimeout(resolve, 1000));
      await removeElement(reading);
      
      // Stage 2: Thinking
      const thinking = await addThinkingIndicator(goodChat, "Thinking...", 0);
      thinking.querySelector('.stage-icon').textContent = '💭';
      await new Promise(resolve => setTimeout(resolve, 1500));
      await removeElement(thinking);
      
      // Stage 3: Crafting
      const crafting = await addThinkingIndicator(goodChat, "Crafting response...", 0);
      crafting.querySelector('.stage-icon').textContent = '✨';
      await new Promise(resolve => setTimeout(resolve, 1000));
      await removeElement(crafting);
      
      // Type out response
      await typeMessage(goodChat, "The capital of France is Paris, a beautiful city known for its iconic Eiffel Tower, rich history, and cultural significance.", 0);
      
      // Show good badge
      const badge = document.createElement('div');
      badge.className = 'status-badge';
      badge.textContent = '✅';
      goodChat.parentElement.appendChild(badge);
      
      await new Promise(resolve => setTimeout(resolve, 2000));
      badge.remove();
    }

    async function runAnimation() {
      await Promise.all([
        runBadSequence(),
        runGoodSequence()
      ]);
      
      // Wait before looping
      await new Promise(resolve => setTimeout(resolve, 2000));
      runAnimation();
    }

    // Start animation
    runAnimation();
  </script>
</body>
</html>
