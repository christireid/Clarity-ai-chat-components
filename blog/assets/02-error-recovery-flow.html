<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation 2: Error Recovery Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 800px;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 300px;
    }

    .message {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 80%;
      position: relative;
      animation: messageIn 0.3s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
      background: hsl(217, 91%, 60%);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
    }

    .status-badge {
      position: absolute;
      bottom: -8px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: badgeIn 0.3s ease-out;
    }

    @keyframes badgeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-badge.sending {
      background: rgba(234, 179, 8, 0.2);
      color: rgb(234, 179, 8);
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .status-badge.failed {
      background: rgba(239, 68, 68, 0.2);
      color: rgb(239, 68, 68);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-badge.sent {
      background: rgba(16, 185, 129, 0.2);
      color: rgb(16, 185, 129);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .spinner {
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .network-indicator {
      align-self: center;
      padding: 12px 20px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      color: rgb(239, 68, 68);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .retry-section {
      align-self: flex-start;
      margin-top: 8px;
      animation: messageIn 0.3s ease-out;
    }

    .retry-button {
      padding: 10px 16px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: rgb(239, 68, 68);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .retry-button:hover {
      background: rgba(239, 68, 68, 0.3);
      transform: translateY(-1px);
    }

    .countdown {
      color: rgba(239, 68, 68, 0.8);
      font-size: 12px;
    }

    .attempts-remaining {
      font-size: 11px;
      opacity: 0.8;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .error-message {
      margin-top: 8px;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .success-celebration {
      align-self: center;
      padding: 14px 20px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      color: rgb(16, 185, 129);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: celebrate 0.5s ease-out;
    }

    @keyframes celebrate {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Error Recovery with Automatic Retry</div>
    <div class="chat-messages" id="chatMessages"></div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    let currentMessage = null;

    function addUserMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message user';
      msg.textContent = text;
      chatMessages.appendChild(msg);
      currentMessage = msg;
      return msg;
    }

    function updateStatus(status, text) {
      // Remove old badge if exists
      const oldBadge = currentMessage?.querySelector('.status-badge');
      if (oldBadge) oldBadge.remove();

      const badge = document.createElement('div');
      badge.className = `status-badge ${status}`;
      
      if (status === 'sending') {
        badge.innerHTML = `<div class="spinner"></div><span>${text}</span>`;
      } else {
        const icon = status === 'sent' ? '✓' : '⚠️';
        badge.innerHTML = `<span>${icon}</span><span>${text}</span>`;
      }
      
      currentMessage.appendChild(badge);
    }

    function showNetworkError() {
      const error = document.createElement('div');
      error.className = 'network-indicator';
      error.innerHTML = `
        <span style="font-size: 18px;">📡</span>
        <span>Network connection lost</span>
      `;
      chatMessages.appendChild(error);
      setTimeout(() => error.remove(), 2000);
    }

    function showRetryButton(attemptNumber, countdown, maxAttempts) {
      // Remove old retry section
      const oldRetry = chatMessages.querySelector('.retry-section');
      if (oldRetry) oldRetry.remove();

      const section = document.createElement('div');
      section.className = 'retry-section';
      
      const button = document.createElement('div');
      button.className = 'retry-button';
      button.innerHTML = `
        <span>🔄</span>
        <span>Retrying${countdown ? ` in ${countdown}s...` : '...'}</span>
        <span class="attempts-remaining">${maxAttempts - attemptNumber} left</span>
      `;
      
      const errorMsg = document.createElement('div');
      errorMsg.className = 'error-message';
      errorMsg.innerHTML = `
        <span>⚠️</span>
        <span>Connection lost. Check your internet and trying again...</span>
      `;
      
      section.appendChild(button);
      section.appendChild(errorMsg);
      chatMessages.appendChild(section);
      
      return section;
    }

    function showSuccess() {
      const success = document.createElement('div');
      success.className = 'success-celebration';
      success.innerHTML = `
        <span style="font-size: 20px;">🎉</span>
        <span>Message sent successfully!</span>
      `;
      chatMessages.appendChild(success);
      setTimeout(() => success.remove(), 2000);
    }

    function addAssistantMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.textContent = text;
      chatMessages.appendChild(msg);
    }

    async function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runAnimation() {
      // Clear
      chatMessages.innerHTML = '';
      
      // User sends message
      await wait(500);
      addUserMessage("Explain quantum computing in simple terms");
      
      // Show sending status
      await wait(300);
      updateStatus('sending', 'Sending...');
      
      // Simulate network delay
      await wait(1500);
      
      // Network error!
      showNetworkError();
      await wait(800);
      updateStatus('failed', 'Failed');
      
      // Show retry button with countdown
      await wait(500);
      let retrySection = showRetryButton(0, 3, 3);
      
      // Countdown
      for (let i = 3; i > 0; i--) {
        await wait(1000);
        retrySection.remove();
        retrySection = showRetryButton(0, i - 1, 3);
      }
      
      // First retry attempt - still fails
      await wait(1000);
      retrySection.remove();
      updateStatus('sending', 'Retrying...');
      await wait(1500);
      showNetworkError();
      await wait(800);
      updateStatus('failed', 'Failed again');
      
      // Second retry with longer countdown
      await wait(500);
      retrySection = showRetryButton(1, 5, 3);
      
      // Countdown
      for (let i = 5; i > 0; i--) {
        await wait(1000);
        retrySection.remove();
        retrySection = showRetryButton(1, i - 1, 3);
      }
      
      // Second retry attempt - SUCCESS!
      await wait(1000);
      retrySection.remove();
      updateStatus('sending', 'Retrying...');
      await wait(1500);
      
      updateStatus('sent', 'Sent');
      showSuccess();
      
      // Add AI response
      await wait(1000);
      addAssistantMessage("Quantum computing uses quantum mechanics principles to process information. Unlike classical computers that use bits (0 or 1), quantum computers use 'qubits' that can be both 0 and 1 simultaneously (superposition).");
      
      // Wait before loop
      await wait(3000);
      
      // Loop
      runAnimation();
    }

    // Start animation
    runAnimation();
  </script>
</body>
</html>
