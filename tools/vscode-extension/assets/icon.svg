<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bgGradient)"/>

  <!-- Chat bubble -->
  <path d="M32 36 h64 a12 12 0 0 1 12 12 v36 a12 12 0 0 1 -12 12 h-40 l-16 16 v-16 h-8 a12 12 0 0 1 -12 -12 v-36 a12 12 0 0 1 12 -12 z"
        fill="white"
        fill-opacity="0.95"/>

  <!-- AI sparkle/star in chat bubble -->
  <g transform="translate(64, 66)">
    <!-- Main star -->
    <path d="M0 -16 L3 -4 L14 0 L3 4 L0 16 L-3 4 L-14 0 L-3 -4 Z"
          fill="url(#sparkGradient)"/>
    <!-- Small sparkles -->
    <circle cx="18" cy="-12" r="2.5" fill="#fbbf24"/>
    <circle cx="-16" cy="10" r="2" fill="#fbbf24"/>
    <circle cx="12" cy="14" r="1.5" fill="#f59e0b"/>
  </g>

  <!-- Subtle shine on bubble -->
  <ellipse cx="48" cy="52" rx="20" ry="8" fill="white" fill-opacity="0.15"/>
</svg>
