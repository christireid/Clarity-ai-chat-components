  <rect x="880" y="200" width="260" height="80" rx="8" fill="#334155"/>
  <circle cx="910" cy="230" r="16" fill="#f97316"/>
  <rect x="935" y="215" width="80" height="14" rx="2" fill="#f8fafc"/>
  <rect x="935" y="235" width="120" height="10" rx="2" fill="#64748b"/>
  <rect x="935" y="250" width="60" height="10" rx="2" fill="#f97316"/>

  <rect x="880" y="290" width="260" height="80" rx="8" fill="#334155"/>
  <circle cx="910" cy="320" r="16" fill="#3b82f6"/>
  <rect x="935" y="305" width="80" height="14" rx="2" fill="#f8fafc"/>
