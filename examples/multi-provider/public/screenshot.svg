  <circle cx="910" cy="140" r="16" fill="#22c55e"/>
  <rect x="935" y="125" width="80" height="14" rx="2" fill="#f8fafc"/>
  <rect x="935" y="145" width="120" height="10" rx="2" fill="#64748b"/>
