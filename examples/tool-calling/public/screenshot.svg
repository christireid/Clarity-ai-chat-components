<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Header -->
  <rect x="40" y="40" width="1120" height="60" rx="12" fill="#334155"/>
  <rect x="60" y="55" width="20" height="30" rx="4" fill="#f97316"/>
  <rect x="90" y="60" width="140" height="20" rx="4" fill="#f8fafc"/>

  <!-- Chat area -->
  <rect x="40" y="120" width="1120" height="430" rx="12" fill="#1e293b"/>

  <!-- User message -->
  <rect x="640" y="150" width="500" height="45" rx="12" fill="#3b82f6"/>
  <rect x="660" y="165" width="220" height="12" rx="2" fill="#93c5fd"/>

  <!-- Tool card - Weather -->
  <rect x="60" y="215" width="400" height="130" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <rect x="80" y="235" width="24" height="24" rx="4" fill="#f59e0b"/>
  <rect x="115" y="238" width="80" height="14" rx="2" fill="#78350f"/>
  <rect x="380" y="235" width="60" height="22" rx="11" fill="#22c55e"/>
  <rect x="390" y="240" width="40" height="12" rx="2" fill="#f0fdf4"/>

  <!-- Tool args -->
  <rect x="80" y="275" width="360" height="30" rx="4" fill="#fefce8"/>
  <rect x="90" y="283" width="200" height="12" rx="2" fill="#713f12"/>

  <!-- Weather result -->
  <rect x="90" y="315" width="48" height="20" rx="4" fill="#f59e0b"/>
  <rect x="150" y="315" width="80" height="16" rx="2" fill="#78350f"/>
  <rect x="150" y="335" width="60" height="10" rx="2" fill="#92400e"/>

  <!-- Tool card - Stock -->
  <rect x="60" y="360" width="400" height="130" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <rect x="80" y="380" width="24" height="24" rx="4" fill="#3b82f6"/>
  <rect x="115" y="383" width="80" height="14" rx="2" fill="#1e3a8a"/>
  <rect x="380" y="380" width="60" height="22" rx="11" fill="#22c55e"/>
  <rect x="390" y="385" width="40" height="12" rx="2" fill="#f0fdf4"/>

  <!-- Tool args -->
  <rect x="80" y="420" width="360" height="30" rx="4" fill="#eff6ff"/>
  <rect x="90" y="428" width="180" height="12" rx="2" fill="#1e3a8a"/>

  <!-- Stock result -->
  <rect x="90" y="460" width="60" height="14" rx="2" fill="#1e3a8a"/>
  <rect x="165" y="458" width="100" height="18" rx="2" fill="#1e40af"/>
  <rect x="90" y="478" width="80" height="10" rx="2" fill="#22c55e"/>

  <!-- Assistant response -->
  <rect x="60" y="510" width="600" height="30" rx="12" fill="#334155"/>
  <rect x="80" y="518" width="400" height="12" rx="2" fill="#64748b"/>

  <!-- User second message -->
  <rect x="700" y="360" width="460" height="45" rx="12" fill="#3b82f6"/>
  <rect x="720" y="375" width="200" height="12" rx="2" fill="#93c5fd"/>

  <!-- Tool suggestions -->
  <rect x="700" y="425" width="140" height="36" rx="8" fill="#334155"/>
  <rect x="720" y="436" width="100" height="12" rx="2" fill="#64748b"/>

  <rect x="850" y="425" width="140" height="36" rx="8" fill="#334155"/>
  <rect x="870" y="436" width="100" height="12" rx="2" fill="#64748b"/>

  <rect x="1000" y="425" width="140" height="36" rx="8" fill="#334155"/>
  <rect x="1020" y="436" width="100" height="12" rx="2" fill="#64748b"/>

  <!-- Input -->
  <rect x="40" y="560" width="1120" height="50" rx="25" fill="#334155"/>
  <rect x="70" y="575" width="200" height="14" rx="2" fill="#475569"/>

  <!-- Tool Calling label -->
  <text x="600" y="625" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Tool Calling - Weather, Stock, Search, Calculator</text>
</svg>
