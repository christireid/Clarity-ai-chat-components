<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla JS Memory Example</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h1 {
      margin-top: 0;
      color: #333;
    }
    
    .chat-container {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fafafa;
    }
    
    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 6px;
    }
    
    .message.user {
      background: #e3f2fd;
      margin-left: 20%;
    }
    
    .message.assistant {
      background: #f3e5f5;
      margin-right: 20%;
    }
    
    .message-role {
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    
    .input-container {
      display: flex;
      gap: 10px;
    }
    
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    button:hover {
      background: #45a049;
    }
    
    .stats {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .stats-item {
      display: inline-block;
      margin-right: 20px;
      color: #666;
    }
    
    .stats-value {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Vanilla JS + Memory System</h1>
    <p>Pure JavaScript example using @clarity-chat/memory</p>
    
    <div class="chat-container" id="chat"></div>
    
    <div class="input-container">
      <input 
        type="text" 
        id="input" 
        placeholder="Type a message..."
        onkeypress="if(event.key === 'Enter') sendMessage()"
      >
      <button onclick="sendMessage()">Send</button>
    </div>
    
    <div class="stats">
      <div class="stats-item">
        <span>Memories: </span>
        <span class="stats-value" id="memoryCount">0</span>
      </div>
      <div class="stats-item">
        <span>Tokens: </span>
        <span class="stats-value" id="tokenCount">0</span>
      </div>
      <div class="stats-item">
        <span>Context Used: </span>
        <span class="stats-value" id="contextUsed">0</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { MemoryService } from '@clarity-chat/memory'
    
    // Initialize memory service
    const memory = new MemoryService({
      tokenOptimization: {
        maxContextWindow: 4096,
        allocation: {
          systemPrompt: 0.10,
          userPreferences: 0.15,
          recentContext: 0.30,
          semanticMemory: 0.25,
          episodicMemory: 0.15,
          responseReserve: 0.05,
        },
        dynamicAllocation: true,
        enableCompression: true,
        enableChunking: true,
      },
      persistence: {
        useVectorStore: false,
        useCache: true,
        useDatabase: false,
      },
      enableAutoCleanup: false,
      retentionPolicy: {
        shortTerm: 3600,
        session: 86400,
        thread: 604800,
        global: 0,
      },
    })
    
    const userId = 'user-' + Math.random().toString(36).substr(2, 9)
    const sessionId = 'session-' + Date.now()
    
    // Make functions global
    window.sendMessage = async function() {
      const input = document.getElementById('input')
      const message = input.value.trim()
      
      if (!message) return
      
      // Clear input
      input.value = ''
      
      // Display user message
      addMessageToUI('user', message)
      
      try {
        // Get relevant memories
        const memories = await memory.query({
          query: message,
          limit: 5,
          minConfidence: 0.5,
          sessionId,
        })
        
        // Build context
        const context = memories.map(m => m.memory.content).join('\n')
        
        // Simulate LLM call (replace with actual API call)
        const response = await simulateLLM(message, context)
        
        // Store user message
        await memory.addMemory(
          message,
          'episodic',
          'session',
          { userId, sessionId, role: 'user' },
          { priority: 'medium' }
        )
        
        // Store assistant response
        await memory.addMemory(
          response,
          'episodic',
          'session',
          { userId, sessionId, role: 'assistant' },
          { priority: 'medium' }
        )
        
        // Display assistant message
        addMessageToUI('assistant', response)
        
        // Update stats
        updateStats(memories.length)
        
      } catch (error) {
        console.error('Error:', error)
        addMessageToUI('assistant', 'Sorry, an error occurred.')
      }
    }
    
    function addMessageToUI(role, content) {
      const chat = document.getElementById('chat')
      const messageDiv = document.createElement('div')
      messageDiv.className = `message ${role}`
      messageDiv.innerHTML = `
        <div class="message-role">${role === 'user' ? 'You' : 'Assistant'}</div>
        <div>${content}</div>
      `
      chat.appendChild(messageDiv)
      chat.scrollTop = chat.scrollHeight
    }
    
    async function simulateLLM(message, context) {
      // Simulate API call delay
      await new Promise(resolve => setTimeout(resolve, 500))
      
      // In real app, call your LLM API here
      // const response = await fetch('/api/chat', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify({ message, context })
      // })
      
      return `I received your message: "${message}". ${context ? `I found ${context.split('\n').length} relevant memories to help answer.` : 'This is our first interaction!'}`
    }
    
    async function updateStats(contextUsed) {
      const stats = memory.getStats()
      
      document.getElementById('memoryCount').textContent = stats.total
      document.getElementById('tokenCount').textContent = stats.totalTokens
      document.getElementById('contextUsed').textContent = contextUsed
    }
    
    // Initial stats
    updateStats(0)
  </script>
</body>
</html>
