<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation 4: Token Counter Warnings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 700px;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .token-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .token-count {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      transition: color 0.3s;
    }

    .token-count.safe {
      color: hsl(142, 71%, 45%);
    }

    .token-count.warning {
      color: hsl(45, 93%, 47%);
    }

    .token-count.critical {
      color: hsl(0, 84%, 60%);
    }

    .token-icon {
      font-size: 20px;
    }

    .token-cost {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      font-family: monospace;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 1s ease-out, background 0.5s;
    }

    .progress-bar.safe {
      background: linear-gradient(90deg, hsl(142, 71%, 45%), hsl(142, 71%, 55%));
    }

    .progress-bar.warning {
      background: linear-gradient(90deg, hsl(45, 93%, 47%), hsl(45, 93%, 57%));
    }

    .progress-bar.critical {
      background: linear-gradient(90deg, hsl(0, 84%, 60%), hsl(0, 84%, 70%));
    }

    .percentage-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }

    .warning-banner {
      padding: 16px 18px;
      border-radius: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 16px;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .warning-banner.warning {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .warning-banner.critical {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .warning-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .warning-content {
      flex: 1;
    }

    .warning-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .warning-banner.warning .warning-title {
      color: hsl(45, 93%, 57%);
    }

    .warning-banner.critical .warning-title {
      color: hsl(0, 84%, 65%);
    }

    .warning-message {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }

    .prune-button {
      margin-top: 10px;
      padding: 8px 14px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 6px;
      color: hsl(0, 84%, 65%);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-block;
    }

    .prune-button:hover {
      background: rgba(239, 68, 68, 0.3);
      transform: translateY(-1px);
    }

    .success-message {
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: hsl(142, 71%, 55%);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      animation: celebrate 0.5s ease-out;
    }

    @keyframes celebrate {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Token Counter with Progressive Warnings</div>
    
    <div class="token-display">
      <div class="token-count safe" id="tokenCount">
        <span class="token-icon">📄</span>
        <span><span id="current">0</span> / 4,096 tokens</span>
      </div>
      <div class="token-cost" id="cost">$0.000</div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar safe" id="progressBar" style="width: 0%"></div>
    </div>

    <div class="percentage-text" id="percentage">0.0% of context window used</div>

    <div id="warningArea"></div>
  </div>

  <script>
    const tokenCountEl = document.getElementById('tokenCount');
    const currentTokensEl = document.getElementById('current');
    const costEl = document.getElementById('cost');
    const progressBar = document.getElementById('progressBar');
    const percentageEl = document.getElementById('percentage');
    const warningArea = document.getElementById('warningArea');

    const MAX_TOKENS = 4096;
    const COST_PER_TOKEN = 0.000002;

    function updateTokenDisplay(tokens) {
      currentTokensEl.textContent = tokens.toLocaleString();
      
      const percentage = (tokens / MAX_TOKENS) * 100;
      const cost = tokens * COST_PER_TOKEN;
      
      costEl.textContent = `$${cost.toFixed(4)}`;
      progressBar.style.width = `${percentage}%`;
      percentageEl.textContent = `${percentage.toFixed(1)}% of context window used`;
      
      // Update colors based on percentage
      tokenCountEl.classList.remove('safe', 'warning', 'critical');
      progressBar.classList.remove('safe', 'warning', 'critical');
      
      if (percentage >= 95) {
        tokenCountEl.classList.add('critical');
        progressBar.classList.add('critical');
      } else if (percentage >= 80) {
        tokenCountEl.classList.add('warning');
        progressBar.classList.add('warning');
      } else {
        tokenCountEl.classList.add('safe');
        progressBar.classList.add('safe');
      }
    }

    function showWarningBanner() {
      warningArea.innerHTML = `
        <div class="warning-banner warning">
          <div class="warning-icon">⚠️</div>
          <div class="warning-content">
            <div class="warning-title">Approaching Context Limit</div>
            <div class="warning-message">
              You're using a large portion of the context window. Older messages may be excluded from future responses.
            </div>
          </div>
        </div>
      `;
    }

    function showCriticalBanner() {
      warningArea.innerHTML = `
        <div class="warning-banner critical">
          <div class="warning-icon">🚨</div>
          <div class="warning-content">
            <div class="warning-title">Context Limit Nearly Reached</div>
            <div class="warning-message">
              The conversation may be truncated soon. Consider pruning older messages to continue.
            </div>
            <div class="prune-button" onclick="pruneMessages()">
              → Prune old messages to free up space
            </div>
          </div>
        </div>
      `;
    }

    function showSuccessMessage() {
      warningArea.innerHTML = `
        <div class="success-message">
          <span style="font-size: 18px;">✅</span>
          <span>Freed 1,890 tokens! You have plenty of space now.</span>
        </div>
      `;
    }

    function clearWarnings() {
      warningArea.innerHTML = '';
    }

    async function animateTokenIncrease(from, to, duration) {
      const steps = 50;
      const increment = (to - from) / steps;
      const stepDuration = duration / steps;
      
      for (let i = 0; i <= steps; i++) {
        const current = Math.round(from + (increment * i));
        updateTokenDisplay(current);
        await new Promise(resolve => setTimeout(resolve, stepDuration));
      }
    }

    window.pruneMessages = async function() {
      // Show pruning animation
      await animateTokenIncrease(3990, 2100, 1000);
      showSuccessMessage();
      
      await new Promise(resolve => setTimeout(resolve, 2000));
      clearWarnings();
    };

    async function runAnimation() {
      // Phase 1: Safe zone (0-79%)
      clearWarnings();
      await animateTokenIncrease(0, 3200, 3000);
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      // Phase 2: Warning zone (80-94%)
      showWarningBanner();
      await animateTokenIncrease(3200, 3850, 2000);
      await new Promise(resolve => setTimeout(resolve, 1500));
      
      // Phase 3: Critical zone (95-100%)
      showCriticalBanner();
      await animateTokenIncrease(3850, 3990, 1500);
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      // Wait for user to "click" prune button
      await new Promise(resolve => setTimeout(resolve, 1500));
      
      // Auto-trigger prune for demo
      await pruneMessages();
      
      // Wait before restarting
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      // Loop
      runAnimation();
    }

    // Start animation
    runAnimation();
  </script>
</body>
</html>
