<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Recovery Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        .chat-window {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
        }

        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .ai-message {
            background: white;
            border: 1px solid #e5e7eb;
            align-self: flex-start;
        }

        .error-card {
            background: #fef2f2;
            border: 2px solid #fca5a5;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .error-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #991b1b;
            font-weight: 600;
        }

        .error-message {
            color: #7f1d1d;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .error-type {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .retry-button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            animation: fadeIn 0.4s ease-out 0.2s both;
        }

        .retry-button:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .retry-button:active {
            transform: translateY(0);
        }

        .retry-button.retrying {
            background: #6b7280;
            cursor: not-allowed;
        }

        .countdown {
            display: inline-block;
            min-width: 20px;
            text-align: center;
        }

        .retry-attempts {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        .success-message {
            background: #d1fae5;
            border: 2px solid #6ee7b7;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            animation: slideDown 0.4s ease-out;
            color: #065f46;
        }

        .backoff-visualization {
            margin-top: 12px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
        }

        .backoff-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .backoff-progress {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-window" id="chatWindow">
            <div class="message user-message">
                What's the weather like today?
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        let step = 0;
        let attemptCount = 0;
        const maxAttempts = 3;
        const backoffDelays = [1000, 3000, 10000];

        function showError() {
            if (step === 0) {
                // Show loading indicator
                setTimeout(() => {
                    const loading = document.createElement('div');
                    loading.className = 'message ai-message';
                    loading.innerHTML = '<span style="opacity: 0.5;">Loading...</span>';
                    chatWindow.appendChild(loading);
                    step++;
                }, 500);
            } else if (step === 1) {
                // Remove loading, show error
                setTimeout(() => {
                    const loading = chatWindow.querySelector('.message:last-child');
                    if (loading) loading.remove();
                    
                    const errorCard = document.createElement('div');
                    errorCard.className = 'error-card';
                    errorCard.innerHTML = `
                        <div class="error-header">
                            <span>⚠️</span>
                            <span>Connection Error</span>
                        </div>
                        <div class="error-type">Network Error</div>
                        <div class="error-message">
                            Unable to connect to the server. Please check your internet connection and try again.
                        </div>
                        <button class="retry-button" onclick="retry()">
                            <span>🔄</span>
                            <span>Retry</span>
                            <span class="countdown" id="countdown"></span>
                        </button>
                        <div class="retry-attempts">
                            Attempt ${attemptCount + 1} of ${maxAttempts}
                        </div>
                    `;
                    chatWindow.appendChild(errorCard);
                    step++;
                }, 1500);
            }
        }

        function retry() {
            attemptCount++;
            const retryButton = document.querySelector('.retry-button');
            const countdown = document.getElementById('countdown');
            
            if (retryButton) {
                retryButton.classList.add('retrying');
                retryButton.disabled = true;
                
                // Show backoff visualization
                const backoffVis = document.createElement('div');
                backoffVis.className = 'backoff-visualization';
                backoffVis.innerHTML = `
                    <div>Waiting before retry (exponential backoff)...</div>
                    <div class="backoff-bar">
                        <div class="backoff-progress" id="backoffProgress" style="width: 0%"></div>
                    </div>
                `;
                chatWindow.appendChild(backoffVis);
                
                const delay = backoffDelays[Math.min(attemptCount - 1, backoffDelays.length - 1)];
                let progress = 0;
                
                const progressInterval = setInterval(() => {
                    progress += 2;
                    const progressBar = document.getElementById('backoffProgress');
                    if (progressBar) {
                        progressBar.style.width = `${progress}%`;
                    }
                    if (progress >= 100) {
                        clearInterval(progressInterval);
                    }
                }, delay / 50);
                
                // Simulate retry
                setTimeout(() => {
                    if (backoffVis) backoffVis.remove();
                    
                    // Simulate success or failure
                    if (attemptCount >= 2) {
                        // Success on second attempt
                        const errorCard = chatWindow.querySelector('.error-card');
                        if (errorCard) errorCard.remove();
                        
                        const success = document.createElement('div');
                        success.className = 'success-message';
                        success.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                <span>✅</span>
                                <span style="font-weight: 600;">Success!</span>
                            </div>
                            <div>Connection restored. Here's your response:</div>
                        `;
                        chatWindow.appendChild(success);
                        
                        setTimeout(() => {
                            const aiMsg = document.createElement('div');
                            aiMsg.className = 'message ai-message';
                            aiMsg.textContent = "It's sunny and 72°F today. Perfect weather for outdoor activities!";
                            chatWindow.appendChild(aiMsg);
                        }, 500);
                        
                        attemptCount = 0;
                        step = 0;
                    } else {
                        // Still failing
                        if (retryButton) {
                            retryButton.classList.remove('retrying');
                            retryButton.disabled = false;
                            const errorCard = chatWindow.querySelector('.error-card');
                            if (errorCard) {
                                const attempts = errorCard.querySelector('.retry-attempts');
                                if (attempts) {
                                    attempts.textContent = `Attempt ${attemptCount + 1} of ${maxAttempts}`;
                                }
                            }
                        }
                    }
                }, delay);
            }
        }

        // Make retry function global
        window.retry = retry;

        // Start animation
        setTimeout(() => {
            showError();
        }, 1000);

        // Reset and loop
        setInterval(() => {
            chatWindow.innerHTML = '<div class="message user-message">What\'s the weather like today?</div>';
            step = 0;
            attemptCount = 0;
            setTimeout(() => {
                showError();
            }, 1000);
        }, 20000);
    </script>
</body>
</html>
